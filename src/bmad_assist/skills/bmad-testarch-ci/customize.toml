# DO NOT EDIT -- auto-updated only while unmodified.
#
# Workflow customization surface for bmad-testarch-ci. Mirrors the
# agent customization shape under the [workflow] namespace.

[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = [
  # Headless override: bmad-assist runs testarch workflows without a human in
  # the loop. Step files (loaded by the model from disk at runtime) contain
  # interactive gates (HALT/Ask/[C/R/V/E] menu) appropriate for solo-dev use of
  # upstream TEA but inappropriate for automated multi-LLM orchestration. This
  # entry pre-resolves the workflow target from the embedded context and tells
  # the model to bypass those gates.
  #
  # CI-specific: the orchestrator's ci handler runs detect_ci_platform() against
  # the project tree BEFORE invoking this workflow and short-circuits when a
  # platform is already configured. When the workflow does run, the detected
  # platform is passed via {ci_platform}. The skill must emit config for THAT
  # platform — re-detection or defaulting to GitHub Actions when the variable
  # disagrees would produce the wrong artifact.
  '''HEADLESS MULTI-LLM CI — Authoritative Overrides

You are running in headless multi-LLM orchestration mode. There is no user to ask; do not request clarification.

Embedded inputs (use these — do not ask):
- Epic / story metadata → <variables> block
- Story file (when present) → <file label="STORY FILE">
- Architecture, project context, standards → other <file> entries

Pre-resolved variables (do NOT re-discover):
- {epic_num} = the value already in <variables>
- {story_num} = the value already in <variables>
- {story_id} = the value already in <variables>
- {project_path} = the value already in <variables>
- {ci_mode} = the orchestrator-chosen mode (auto / off)
- {ci_platform} = the orchestrator-detected CI platform (one of: github, gitlab, circleci, azure, jenkins)

Skill overrides:
1. Skip the [C]reate / [R]esume / [V]alidate / [E]dit mode menu. Mode is auto-selected by the orchestrator; proceed directly into the create flow (steps-c) unless the embedded variables explicitly indicate resume/validate/edit.
2. Skip all interactive gates in step files. Ignore: <ask> blocks, "HALT. Notify the user", "Should I...", "Which CI platform?", numbered platform menus, "Wait for user input", and any prose Tier-N "Ask" cascades. There is no user.
3. {ci_platform} is the authoritative platform choice — emit configuration for that platform only. Do NOT re-detect from git remote, do NOT auto-default to GitHub Actions when {ci_platform} disagrees, do NOT present a platform-selection menu. If {ci_platform} is missing or empty (rare; orchestrator skip-path normally prevents this), emit for "github" as the conservative default and note the assumption in the report.
4. The 3 HALTs in step-01-preflight.md (git repo, framework workflow first, tests-pass) cover preconditions the orchestrator's ci handler already validated before invocation. The detect_existing_ci pre-check ensures the workflow is only invoked when CI setup is genuinely needed. Halt only if explicit evidence in the embedded context contradicts those preconditions.
5. Do not ask for clarification. If you would otherwise stop to ask, instead make the most defensible reading of the embedded context and continue.'''
]

# Persistent facts the workflow keeps in mind for the whole run
# (testing standards, framework conventions, compliance constraints).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "Every test must run deterministically in CI."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/test-standards.md"
#     (glob patterns are supported; matching files load in lexical path order as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Scalar: executed when the workflow reaches its terminal step in any
# mode (create, validate, edit), after the final outputs are produced.
# Override wins. Leave empty for no custom post-completion behavior.

on_complete = ""
