[workflow]

# --- Configurable below. Overrides merge per BMad structural rules: ---
#   scalars: override wins • arrays (persistent_facts, activation_steps_*): append
#   arrays-of-tables with `code`/`id`: replace matching items, append new ones.

# Steps to run before the standard activation (config load, greet).
# Overrides append. Use for pre-flight loads, compliance checks, etc.

activation_steps_prepend = []

# Steps to run after greet but before the workflow begins.
# Overrides append. Use for context-heavy setup that should happen
# once the user has been acknowledged.

activation_steps_append = [
  # Headless override: bmad-assist runs retrospectives without a human in the
  # loop. The upstream bmad-retrospective skill is party-mode interactive —
  # Bob/Scrum Master facilitates a conversational session, pausing at multiple
  # gates ("Q1 — A3-3 status:", "What's your take on...?") for user replies
  # that never come in headless orchestration. Without this override the LLM
  # produces mid-workflow dialogue, never reaches Step 11 (save report), and
  # the orchestrator's extractor falls through to raw-content fallback — see
  # docs/known-issues.md RETRO-001.
  #
  # The pattern mirrors the headless directives bundled into bmad-validate-story
  # (customize.toml:21-82) and the 8 testarch skills (commit f6d5b17 / C.1).
  '''HEADLESS MULTI-LLM RETROSPECTIVE — Authoritative Overrides

You are running in headless multi-LLM orchestration mode. There is no user to ask; do not request clarification. Do not enter party-mode interactive dialogue.

Embedded inputs (use these — do not ask):
- Epic / story metadata → <variables> block
- Story files, sprint-status, antipatterns, prior retrospectives → <file> entries in <context>
- Project context, architecture, standards → other <file> entries

Pre-resolved variables (do NOT re-discover):
- {epic_num} = the value already in <variables>
- {project_path} = the value already in <variables>
- {user_name} = the value already in <variables> (do not greet conversationally; this is a non-interactive run)

Skill overrides:
1. Skip Steps 5 (Greet the User) interactive greeting and all party-mode dialogue gates throughout the workflow. Ignore: interactive ask elements, "Q1 — ...?" / "Q2 — ...?" cascades, "What is your take on...", "Bob (Scrum Master):" / "Sally:" / "Murat:" / persona-prompted user replies, numbered selection menus, "Wait for user input", and any prose Tier-N "Ask" cascades. (Do not echo the literal upstream tag syntax for these gates — it would collide with the orchestrator's regex stripper for interactive blocks.)
2. Execute the full pipeline through Step 11 (Save Retrospective) and Step 12 (Final Summary) without pausing. The retrospective should synthesize the embedded artifacts (sprint outcomes, antipatterns, prior retros) directly into the structured report — no facilitated discussion is required because there is no participant to facilitate.
3. Do not ask for clarification. If you would otherwise stop to ask, instead make the most defensible reading of the embedded context and continue.

REQUIRED OUTPUT FORMAT — Marker-Wrapped Report

The orchestrator extracts the retrospective report by grepping for literal HTML comment markers ([core/extraction.py](https://example.invalid)). Without the markers, the extractor falls through 3 fallback patterns and saves the raw response body as the "report" — a silent-success failure mode.

Your final output MUST begin with the start marker and end with the end marker, exactly:

<!-- RETROSPECTIVE_REPORT_START -->

# Epic {epic_num} Retrospective

... full structured retrospective per Step 11 ...

<!-- RETROSPECTIVE_REPORT_END -->

The markers are literal HTML comment strings. Do not paraphrase them. Do not omit either marker. Emit the START marker before any report content and the END marker after all report content, including action items and handoff notes.'''
]

# Persistent facts the workflow keeps in mind for the whole run
# (standards, compliance constraints, stylistic guardrails).
# Distinct from the runtime memory sidecar — these are static context
# loaded on activation. Overrides append.
#
# Each entry is either:
#   - a literal sentence, e.g. "All retrospectives must produce SMART action items with named owners."
#   - a file reference prefixed with `file:`, e.g. "file:{project-root}/docs/standards.md"
#     (glob patterns are supported; the file's contents are loaded and treated as facts).

persistent_facts = [
  "file:{project-root}/**/project-context.md",
]

# Scalar: executed when the workflow reaches Step 12 (Final Summary and Handoff),
# after the retrospective document is saved and sprint-status is updated. Override wins.
# Leave empty for no custom post-completion behavior.

on_complete = ""
